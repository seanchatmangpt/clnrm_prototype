# Cleanroom Testing Framework - Development Tasks
# Production-grade Rust development workflow

# Environment configuration
[env]
RUST_LOG = "info"
RUST_BACKTRACE = "1"
CARGO_INCREMENTAL = "1"
CARGO_NET_RETRY = "2"
CARGO_HTTP_TIMEOUT = "30"
CARGO_MAKE_CARGO_VERBOSE_FLAGS = "--verbose"
CARGO_MAKE_CARGO_BUILD_FLAGS = "--all-features"
CARGO_MAKE_CARGO_TEST_FLAGS = "--all-features"
CARGO_MAKE_CARGO_CLIPPY_FLAGS = "--all-targets --all-features -- -D warnings"

# Testcontainers configuration
[env.TESTCONTAINERS]
TESTCONTAINERS_RYUK_DISABLED = "false"
TESTCONTAINERS_WAIT_STRATEGY_TIMEOUT = "60"
TESTCONTAINERS_STARTUP_TIMEOUT = "120"
TESTCONTAINERS_LOG_LEVEL = "info"

# Performance testing configuration
[env.PERF]
RUST_LOG = "warn"
CARGO_PROFILE_BENCH_DEBUG = "false"
CARGO_PROFILE_BENCH_OPT_LEVEL = "3"
CARGO_PROFILE_BENCH_LTO = "fat"
CARGO_PROFILE_BENCH_CODEGEN_UNITS = "1"

# Security configuration
[env.SECURITY]
CARGO_AUDIT_ADVISORIES_DB_URL = "https://github.com/RustSec/advisory-db"
CARGO_AUDIT_DENY = "warnings"
CARGO_AUDIT_DENY_UNMAINTAINED = "warn"
CARGO_AUDIT_DENY_UNSUPPORTED = "warn"

# Development configuration
[env.DEV]
RUST_LOG = "debug"
RUST_BACKTRACE = "full"
CARGO_INCREMENTAL = "1"
CARGO_PROFILE_DEV_DEBUG = "true"

# Release configuration
[env.RELEASE]
RUST_LOG = "warn"
CARGO_PROFILE_RELEASE_OPT_LEVEL = "3"
CARGO_PROFILE_RELEASE_LTO = "fat"
CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
CARGO_PROFILE_RELEASE_PANIC = "abort"

# Documentation configuration
[env.DOCS]
RUSTDOCFLAGS = "--enable-index-page --enable-permissive-allowlist"

# Benchmark configuration
[env.BENCH]
RUST_LOG = "error"
CARGO_PROFILE_BENCH_OPT_LEVEL = "3"
CARGO_PROFILE_BENCH_LTO = "fat"
CARGO_PROFILE_BENCH_CODEGEN_UNITS = "1"

# Core development tasks
[tasks.check]
description = "Check code without building"
command = "cargo"
args = ["check", "--all-features"]

[tasks.check-release]
description = "Check code in release mode"
command = "cargo"
args = ["check", "--release", "--all-features"]

[tasks.build]
description = "Build in debug mode"
command = "cargo"
args = ["build", "--all-features"]

[tasks.build-release]
description = "Build in release mode"
command = "cargo"
args = ["build", "--release", "--all-features"]

[tasks.clean]
description = "Clean build artifacts"
command = "cargo"
args = ["clean"]

[tasks.fmt]
description = "Format code with rustfmt"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
description = "Check code formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.lint]
description = "Run clippy with strict settings"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.lint-fix]
description = "Run clippy with auto-fix suggestions"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--fix", "--allow-dirty"]

# Testing tasks
[tasks.test]
description = "Run all tests"
command = "cargo"
args = ["test", "--all-features"]

[tasks.test-unit]
description = "Unit tests only"
command = "cargo"
args = ["test", "--lib", "--all-features"]

[tasks.test-integration]
description = "Integration tests only"
command = "cargo"
args = ["test", "--test", "*", "--all-features"]

[tasks.test-doc]
description = "Run documentation tests"
command = "cargo"
args = ["test", "--doc", "--all-features"]

[tasks.test-verbose]
description = "Run tests with verbose output"
command = "cargo"
args = ["test", "--all-features", "--", "--nocapture"]

[tasks.test-release]
description = "Run tests in release mode"
command = "cargo"
args = ["test", "--release", "--all-features"]

# Testcontainers-specific tasks
[tasks.test-containers]
description = "Run tests with testcontainers (requires Docker)"
command = "cargo"
args = ["test", "--all-features", "--", "--nocapture"]
env = { "RUST_LOG" = "info", "TESTCONTAINERS_RYUK_DISABLED" = "false" }

[tasks.test-containers-postgres]
description = "Run PostgreSQL container tests"
command = "cargo"
args = ["test", "--all-features", "--", "--nocapture", "postgres"]
env = { "RUST_LOG" = "info" }

[tasks.test-containers-redis]
description = "Run Redis container tests"
command = "cargo"
args = ["test", "--all-features", "--", "--nocapture", "redis"]
env = { "RUST_LOG" = "info" }

[tasks.test-containers-generic]
description = "Run generic container tests"
command = "cargo"
args = ["test", "--all-features", "--", "--nocapture", "generic"]
env = { "RUST_LOG" = "info" }

[tasks.test-containers-all]
description = "Run all container tests"
dependencies = [
  "test-containers-postgres",
  "test-containers-redis",
  "test-containers-generic",
]

# Property-based testing
[tasks.test-proptest]
description = "Run property-based tests with proptest"
command = "cargo"
args = ["test", "--all-features", "--", "--nocapture", "proptest"]

[tasks.test-proptest-parallel]
description = "Run property-based tests in parallel"
command = "cargo"
args = [
  "test",
  "--all-features",
  "--",
  "--test-threads",
  "4",
  "--nocapture",
  "proptest",
]

# Benchmarking tasks
[tasks.bench]
description = "Run all benchmarks"
command = "cargo"
args = ["bench", "--all-features"]

[tasks.bench-config]
description = "Benchmark configuration creation"
command = "cargo"
args = ["bench", "--bench", "config_creation"]

[tasks.bench-container]
description = "Benchmark container lifecycle"
command = "cargo"
args = ["bench", "--bench", "container_lifecycle"]

[tasks.bench-scenario]
description = "Benchmark scenario execution"
command = "cargo"
args = ["bench", "--bench", "scenario_execution"]

[tasks.bench-orchestrator]
description = "Benchmark concurrency orchestrator"
command = "cargo"
args = ["bench", "--bench", "orchestrator_performance"]

[tasks.bench-all]
description = "Run all benchmarks"
dependencies = [
  "bench-config",
  "bench-container",
  "bench-scenario",
  "bench-orchestrator",
]

# Performance profiling
[tasks.profile]
description = "Profile performance with flamegraph"
command = "cargo"
args = ["flamegraph", "--bin", "cleanroom-bench", "--bench", "config_creation"]

[tasks.profile-container]
description = "Profile container operations"
command = "cargo"
args = [
  "flamegraph",
  "--bin",
  "cleanroom-bench",
  "--bench",
  "container_lifecycle",
]

[tasks.profile-scenario]
description = "Profile scenario execution"
command = "cargo"
args = [
  "flamegraph",
  "--bin",
  "cleanroom-bench",
  "--bench",
  "scenario_execution",
]

# Security and audit tasks
[tasks.audit]
description = "Security audit with cargo-audit"
command = "cargo"
args = ["audit"]

[tasks.audit-outdated]
description = "Check for outdated dependencies"
command = "cargo"
args = ["outdated"]

[tasks.audit-unused]
description = "Check for unused dependencies (requires nightly)"
command = "cargo"
args = ["+nightly", "udeps"]

[tasks.audit-deny]
description = "Comprehensive dependency audit with cargo-deny"
command = "cargo"
args = ["deny", "check"]

[tasks.audit-all]
description = "Run all dependency audits"
dependencies = ["audit", "audit-outdated", "audit-deny"]

# Documentation tasks
[tasks.docs]
description = "Build documentation"
command = "cargo"
args = ["doc", "--all-features", "--no-deps", "--open"]

[tasks.docs-build]
description = "Build documentation without opening"
command = "cargo"
args = ["doc", "--all-features", "--no-deps"]

[tasks.docs-test]
description = "Test documentation build"
dependencies = ["docs-build"]
command = "echo"
args = ["Documentation built successfully"]

# Example tasks
[tasks.examples]
description = "Run all examples"
command = "cargo"
args = ["run", "--example", "concurrent_execution"]

[tasks.examples-concurrent]
description = "Run concurrent execution example"
command = "cargo"
args = ["run", "--example", "concurrent_execution"]

[tasks.examples-builder]
description = "Run builder pattern example"
command = "cargo"
args = ["run", "--example", "builder_patterns"]

[tasks.examples-async]
description = "Run async patterns example"
command = "cargo"
args = ["run", "--example", "async_patterns"]

[tasks.examples-guards]
description = "Run RAII guards example"
command = "cargo"
args = ["run", "--example", "guard_patterns"]

[tasks.examples-streaming]
description = "Run streaming artifacts example"
command = "cargo"
args = ["run", "--example", "streaming_artifacts"]

[tasks.examples-observability]
description = "Run observability setup example"
command = "cargo"
args = ["run", "--example", "observability_setup"]

[tasks.examples-all]
description = "Run all examples"
dependencies = [
  "examples-concurrent",
  "examples-builder",
  "examples-async",
  "examples-guards",
  "examples-streaming",
  "examples-observability",
]

# Cleanroom-specific validation tasks
[tasks.validate]
description = "Validate cleanroom implementation"
dependencies = ["test-unit", "test-integration", "lint", "audit"]

[tasks.validate-containers]
description = "Validate container implementations"
dependencies = ["test-containers-all", "bench-container"]

[tasks.validate-orchestrator]
description = "Validate concurrency orchestrator"
dependencies = ["test-proptest", "bench-orchestrator"]

[tasks.validate-performance]
description = "Validate performance characteristics"
dependencies = ["bench-all", "profile"]

[tasks.validate-production]
description = "Comprehensive production readiness validation"
dependencies = [
  "validate",
  "validate-containers",
  "validate-orchestrator",
  "validate-performance",
  "test-proptest-parallel",
  "audit-all",
  "docs-test",
]

# CI/CD pipeline tasks
[tasks.ci]
description = "Run CI pipeline"
dependencies = ["fmt-check", "lint", "test", "audit-all", "docs-test"]

[tasks.ci-full]
description = "Run full CI pipeline with all validations"
dependencies = ["validate-production"]

[tasks.ci-containers]
description = "Run CI pipeline with container tests"
dependencies = ["fmt-check", "lint", "test-containers-all", "audit-all"]

# Release tasks
[tasks.release-check]
description = "Check release readiness"
dependencies = ["ci-full", "bench-all"]

[tasks.release]
description = "Create a release"
dependencies = ["release-check"]

# Development workflow tasks
[tasks.dev-setup]
description = "Set up development environment"
script = '''
echo "🔧 Setting up Cleanroom development environment..."
echo "📦 Installing development dependencies..."

# Check Rust toolchain
rustup show

# Check cargo-make
cargo make --version

# Check Docker for testcontainers
docker --version
docker ps > /dev/null 2>&1 && echo "✅ Docker daemon running" || echo "❌ Docker daemon not running"

# Check benchmarking tools
cargo install flamegraph || echo "⚠️  flamegraph not installed (optional)"

# Check audit tools
cargo install cargo-audit || echo "⚠️  cargo-audit not installed"
cargo install cargo-outdated || echo "⚠️  cargo-outdated not installed"
cargo install cargo-deny || echo "⚠️  cargo-deny not installed"

echo "✅ Development environment setup complete!"
'''

[tasks.dev-watch]
description = "Watch for changes and run tests"
command = "cargo"
args = ["watch", "-x", "test --all-features"]

[tasks.dev-watch-lint]
description = "Watch for changes and run linting"
command = "cargo"
args = ["watch", "-x", "clippy --all-features"]

# Docker and container management
[tasks.docker-status]
description = "Check Docker status and resource usage"
script = '''
echo "🐳 Docker Status Check"
echo "====================="
docker --version
docker ps > /dev/null 2>&1 && echo "✅ Docker daemon running" || echo "❌ Docker daemon not running"
echo ""
echo "📊 Docker resource usage:"
docker system df
echo ""
echo "🏃 Running containers:"
docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
'''

[tasks.docker-cleanup]
description = "Clean up Docker resources"
script = '''
echo "🧹 Cleaning up Docker resources..."
docker system prune -f
docker volume prune -f
echo "✅ Docker cleanup complete"
'''

[tasks.docker-reset]
description = "Reset Docker environment (WARNING: removes all containers and images)"
script = '''
echo "⚠️  WARNING: This will remove ALL Docker containers and images!"
echo "Press Ctrl+C to cancel, or Enter to continue..."
read
docker system prune -a -f --volumes
echo "✅ Docker environment reset complete"
'''

# Performance monitoring
[tasks.perf-monitor]
description = "Monitor performance metrics"
script = '''
echo "📊 Performance Monitoring"
echo "========================"
echo "System load:"
uptime
echo ""
echo "Memory usage:"
if command -v free >/dev/null 2>&1; then
    free -h
else
    # macOS alternative
    vm_stat | head -10
fi
echo ""
echo "Disk usage:"
df -h
echo ""
echo "Rust toolchain:"
rustup show
echo ""
echo "Cargo cache size:"
du -sh ~/.cargo/registry
'''

# Quality assurance
[tasks.qa]
description = "Run quality assurance checks"
dependencies = ["lint", "test", "audit-all", "docs-test"]

[tasks.qa-full]
description = "Run comprehensive quality assurance"
dependencies = ["qa", "bench-all", "test-proptest-parallel"]

# Maintenance tasks
[tasks.maintenance]
description = "Run maintenance tasks"
dependencies = ["audit-outdated", "docker-cleanup", "perf-monitor"]

[tasks.maintenance-update]
description = "Update dependencies and toolchain"
script = '''
echo "🔄 Updating Rust toolchain..."
rustup update
echo ""
echo "📦 Checking for outdated dependencies..."
cargo outdated
echo ""
echo "🔒 Running security audit..."
cargo audit
'''

# Troubleshooting tasks
[tasks.troubleshoot]
description = "Troubleshoot common issues"
script = '''
echo "🔍 Cleanroom Troubleshooting"
echo "============================"
echo ""
echo "1. Rust toolchain:"
rustup show
echo ""
echo "2. Cargo version:"
cargo --version
echo ""
echo "3. Docker status:"
docker --version
docker ps > /dev/null 2>&1 && echo "✅ Docker running" || echo "❌ Docker not running"
echo ""
echo "4. Testcontainers environment:"
echo "TESTCONTAINERS_RYUK_DISABLED=${TESTCONTAINERS_RYUK_DISABLED:-not set}"
echo "TESTCONTAINERS_WAIT_STRATEGY_TIMEOUT=${TESTCONTAINERS_WAIT_STRATEGY_TIMEOUT:-not set}"
echo ""
echo "5. Build status:"
cargo check --all-features
echo ""
echo "6. Test status:"
cargo test --all-features --dry-run
'''

[tasks.troubleshoot-containers]
description = "Troubleshoot container issues"
script = '''
echo "🐳 Container Troubleshooting"
echo "============================"
echo ""
echo "Docker daemon status:"
docker info > /dev/null 2>&1 && echo "✅ Docker daemon accessible" || echo "❌ Docker daemon not accessible"
echo ""
echo "Available images:"
docker images | head -10
echo ""
echo "Running containers:"
docker ps
echo ""
echo "Container logs (if any):"
docker logs $(docker ps -q) 2>/dev/null || echo "No running containers"
echo ""
echo "Testcontainers test:"
cargo test --all-features -- --nocapture testcontainers_basic 2>&1 | head -20
'''

# Help and information
[tasks.help]
description = "Show available tasks"
command = "cargo"
args = ["make", "--list-all-steps"]

[tasks.info]
description = "Show project information"
script = '''
echo "🧪 Cleanroom Testing Framework"
echo "=============================="
echo ""
echo "📋 Project: $(cargo read-manifest | jq -r '.name')"
echo "📦 Version: $(cargo read-manifest | jq -r '.version')"
echo "📝 Description: $(cargo read-manifest | jq -r '.description')"
echo "🏠 Repository: $(cargo read-manifest | jq -r '.repository // "Not specified"')"
echo ""
echo "🔧 Rust toolchain:"
rustup show
echo ""
echo "📊 Dependencies:"
cargo tree --depth 1
'''

# Advanced testing features
[tasks.test-miri]
description = "Run tests with Miri (memory safety checker)"
command = "cargo"
args = ["+nightly", "miri", "test", "--all-features"]
condition = { env_set = ["MIRI"] }

[tasks.test-loom]
description = "Run tests with Loom (concurrency checker)"
command = "cargo"
args = ["test", "--features", "loom", "--all-features"]
condition = { env_set = ["LOOM"] }

[tasks.test-sanitizer]
description = "Run tests with sanitizers"
command = "cargo"
args = ["test", "--all-features"]
env = { RUSTFLAGS = "-Zsanitizer=address", ASAN_OPTIONS = "detect_odr_violation=0" }
condition = { env_set = ["SANITIZER"] }

[tasks.test-valgrind]
description = "Run tests with Valgrind (memory leak detection)"
command = "valgrind"
args = [
  "--leak-check=full",
  "--show-leak-kinds=all",
  "--track-origins=yes",
  "cargo",
  "test",
  "--all-features",
]
condition = { env_set = ["VALGRIND"] }

[tasks.test-coverage]
description = "Run tests with coverage collection"
command = "cargo"
args = [
  "tarpaulin",
  "--all-features",
  "--out",
  "Html",
  "--output-dir",
  "target/coverage",
]

[tasks.test-coverage-lcov]
description = "Run tests with LCOV coverage"
command = "cargo"
args = [
  "tarpaulin",
  "--all-features",
  "--out",
  "Lcov",
  "--output-dir",
  "target/coverage",
]

[tasks.test-coverage-open]
description = "Open coverage report in browser"
command = "open"
args = ["target/coverage/tarpaulin-report.html"]
condition = { env_set = ["OPEN_COVERAGE"] }

