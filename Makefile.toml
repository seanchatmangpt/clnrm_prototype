args = [
  "release",
  "create",
  "v${CARGO_MAKE_CRATE_VERSION}",
  "--title",
  "v${CARGO_MAKE_CRATE_VERSION}",
  "--notes",
  "Release v${CARGO_MAKE_CRATE_VERSION}",
]

# Advanced monitoring features
[tasks.monitor-metrics]
description = "Collect performance metrics"
script = '''
echo "📊 Collecting Performance Metrics"
echo "================================="
echo "Timestamp: $(date)"
echo "Rust version: $(rustc --version)"
echo "Cargo version: $(cargo --version)"
echo "System load: $(uptime | awk '{print $10,$11,$12}')"
echo "Memory usage: $(ps -o pid,ppid,pcpu,pmem,comm -A | sort -k4 -nr | head -5)"
echo "Disk usage: $(df -h | grep -E '^/dev/' | awk '{print $1,$5,$6}')"
echo "Network connections: $(netstat -an | grep ESTABLISHED | wc -l)"
'''

[tasks.monitor-alerts]
description = "Check for system alerts"
script = '''
echo "🚨 System Alerts Check"
echo "======================"
# Check disk space
disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
if [ "$disk_usage" -gt 90 ]; then
    echo "⚠️  Disk usage is high: ${disk_usage}%"
fi

# Check memory usage
memory_usage=$(ps -A -o %mem | awk '{s+=$1} END {print s}')
if [ "$memory_usage" -gt 80 ]; then
    echo "⚠️  Memory usage is high: ${memory_usage}%"
fi

# Check Docker status
if ! docker ps >/dev/null 2>&1; then
    echo "❌ Docker daemon is not running"
fi

echo "✅ System alerts check complete"
'''

# Advanced troubleshooting features
[tasks.troubleshoot-network]
description = "Troubleshoot network issues"
script = '''
echo "🌐 Network Troubleshooting"
echo "=========================="
echo "Network interfaces:"
ifconfig | grep -E "inet |flags"
echo ""
echo "DNS resolution:"
nslookup google.com
echo ""
echo "Network connectivity:"
ping -c 3 google.com
echo ""
echo "Port availability:"
netstat -an | grep LISTEN | head -10
'''

[tasks.troubleshoot-rust]
description = "Troubleshoot Rust issues"
script = '''
echo "🦀 Rust Troubleshooting"
echo "======================="
echo "Rust toolchain:"
rustup show
echo ""
echo "Cargo configuration:"
cargo config get 2>/dev/null || echo "Cargo config command not available on stable"
echo ""
echo "Environment variables:"
env | grep -E "RUST|CARGO" | sort
echo ""
echo "Cargo cache:"
du -sh ~/.cargo/registry
if [ -d ~/.cargo/git ]; then
    du -sh ~/.cargo/git
else
    echo "Git cache directory not found"
fi
echo ""
echo "Target directory:"
du -sh target/
'''

[tasks.troubleshoot-containers-detailed]
description = "Detailed container troubleshooting"
script = '''
echo "🐳 Detailed Container Troubleshooting"
echo "====================================="
echo "Docker version:"
docker --version
echo ""
echo "Docker info:"
docker info | head -20
echo ""
echo "Container images:"
docker images | head -10
echo ""
echo "Container processes:"
docker ps -a | head -10
echo ""
echo "Docker logs (last 20 lines):"
docker logs $(docker ps -q | head -1) 2>/dev/null | tail -20 || echo "No running containers"
echo ""
echo "Docker system info:"
docker system df
echo ""
echo "Testcontainers test:"
timeout 30 cargo test --all-features -- --nocapture testcontainers_basic 2>&1 | head -30
'''

