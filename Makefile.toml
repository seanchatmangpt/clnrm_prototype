# Advanced development features
[tasks.dev-install-tools]
description = "Install development tools"
script = '''
echo "🔧 Installing development tools..."
cargo install cargo-watch || echo "⚠️  cargo-watch already installed"
cargo install cargo-expand || echo "⚠️  cargo-expand already installed"
cargo install cargo-tree || echo "⚠️  cargo-tree already installed"
cargo install cargo-outdated || echo "⚠️  cargo-outdated already installed"
cargo install cargo-audit || echo "⚠️  cargo-audit already installed"
cargo install cargo-deny || echo "⚠️  cargo-deny already installed"
cargo install cargo-tarpaulin || echo "⚠️  cargo-tarpaulin already installed"
cargo install cargo-flamegraph || echo "⚠️  cargo-flamegraph already installed"
cargo install cargo-make || echo "⚠️  cargo-make already installed"
echo "✅ Development tools installation complete"
'''

[tasks.dev-check-tools]
description = "Check if development tools are installed"
script = '''
echo "🔍 Checking development tools..."
tools=("cargo-watch" "cargo-expand" "cargo-tree" "cargo-outdated" "cargo-audit" "cargo-deny" "cargo-tarpaulin" "cargo-flamegraph" "cargo-make")
for tool in "${tools[@]}"; do
    if command -v "$tool" >/dev/null 2>&1; then
        echo "✅ $tool is installed"
    else
        echo "❌ $tool is not installed"
    fi
done
'''

[tasks.dev-rustup-components]
description = "Install Rust toolchain components"
script = '''
echo "🦀 Installing Rust toolchain components..."
rustup component add rustfmt clippy rust-src
rustup component add --toolchain nightly rustfmt clippy rust-src
echo "✅ Rust toolchain components installed"
'''

