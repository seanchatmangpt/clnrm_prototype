[tasks.release-prepare]
description = "Prepare release"
dependencies = ["release-check", "release-version", "release-changelog"]

[tasks.release-version]
description = "Update version numbers"
command = "cargo"
args = ["bump", "patch"]

[tasks.release-changelog]
description = "Generate changelog"
command = "git"
args = ["log", "--oneline", "--since", "1 week ago"]

[tasks.release-tag]
description = "Create release tag"
command = "git"
args = [
  "tag",
  "-a",
  "v${CARGO_MAKE_CRATE_VERSION}",
  "-m",
