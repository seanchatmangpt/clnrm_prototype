# Advanced utility features
[tasks.utils-clean-all]
description = "Clean all build artifacts and caches"
script = '''
echo "🧹 Cleaning all build artifacts and caches..."
cargo clean
rm -rf target/
rm -rf ~/.cargo/registry/cache/
rm -rf ~/.cargo/git/db/
docker system prune -f
echo "✅ Cleanup complete"
'''

[tasks.utils-backup]
description = "Backup project state"
script = '''
echo "💾 Backing up project state..."
backup_dir="backup-$(date +%Y%m%d-%H%M%S)"
mkdir -p "$backup_dir"
cp -r src/ "$backup_dir/"
cp Cargo.toml "$backup_dir/"
cp Makefile.toml "$backup_dir/"
cp README.md "$backup_dir/"
echo "✅ Backup created: $backup_dir"
'''

[tasks.utils-restore]
description = "Restore project from backup"
script = '''
echo "🔄 Restoring project from backup..."
if [ -z "$BACKUP_DIR" ]; then
    echo "❌ Please set BACKUP_DIR environment variable"
    exit 1
fi
if [ ! -d "$BACKUP_DIR" ]; then
    echo "❌ Backup directory not found: $BACKUP_DIR"
    exit 1
fi
cp -r "$BACKUP_DIR"/* .
echo "✅ Project restored from: $BACKUP_DIR"
'''

