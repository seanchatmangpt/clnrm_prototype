[package]
name = "clnrm"
version = "0.2.0"
edition = "2021"
authors = ["Cleanroom Contributors"]
description = "Deterministic, hermetic execution environment for testing and validation"
license = "MIT"
repository = "https://github.com/sac/ggen"
keywords = ["testing", "hermetic", "deterministic", "containers", "validation"]
categories = ["development-tools", "development-tools::testing"]

[dependencies]
# Core dependencies (always included)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.47", features = ["full"] }
base64 = "0.22"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
rand = "0.9"
fastrand = "2.3"
regex = "1.12"
tempfile = "3.23"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9"
sha2 = "0.10"

# Container dependencies (required)
testcontainers = { version = "0.25", features = ["blocking"] }
testcontainers-modules = { version = "0.13", features = ["postgres", "redis"] }
futures-util = "0.3"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = "0.3"

# OpenTelemetry dependencies (latest versions)
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-stdout = "0.31"
opentelemetry-jaeger = "0.22"
opentelemetry-otlp = "0.31"
opentelemetry-prometheus-text-exporter = "0.2"

# Optional features
[features]
default = []
coverage = []
signing = []
services = []
advanced_benchmarks = []

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "cleanroom"
path = "src/bin/cleanroom.rs"

[[bin]]
name = "micro_cli"
path = "src/bin/micro_cli.rs"

[[bench]]
name = "production_benchmarks"
harness = false

[dev-dependencies]
criterion = "0.7"
proptest = "1.9"
insta = "1.44"
cucumber = { version = "0.21", features = ["macros"] }
assert_cmd = "2.1"
predicates = "3.1"
mockito = "1.7"
shell-words = "1.1"

[lints.clippy]
# Production code lints - deny unsafe patterns
expect_used = "deny"
unwrap_used = "deny"
panic = "warn"
indexing_slicing = "warn"
